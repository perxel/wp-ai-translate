name: Deploy to WordPress.org

# Push a tag like `1.0.0` (or create a GitHub Release) to publish that version
# to the WordPress.org plugin SVN repo. Requires the repo secrets
# SVN_USERNAME and SVN_PASSWORD (your WordPress.org account).

on:
  push:
    tags:
      - "*"

jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: perxel-ai-translate

  assets:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WordPress.org readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: perxel-ai-translate
