name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer run lint

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check what actually ships, not the repo: the build strips vendor dev
      # tooling, composer.json, .github, etc. (see .distignore). Checking the
      # raw checkout makes Plugin Check flag those as "application files".
      - name: Build the shippable plugin
        run: bin/build-zip.sh

      - name: Unpack the build
        run: unzip -q dist/perxel-ai-translate.zip -d build

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/perxel-ai-translate
          # The repo is github.com/perxel/wp-ai-translate but the WordPress.org
          # slug (and text domain) is perxel-ai-translate. Without this, every
          # __() call reads as a text-domain mismatch.
          slug: perxel-ai-translate
          # Documented false positives, mirrored from phpcs.xml.dist (Plugin
          # Check does not read that file, so the list is repeated here):
          #  - NonPrefixedNamespaceFound: the vendor namespace Perxel\AITranslate.
          #  - NonPrefixedHooknameFound: wpml_* hook names are WPML's own API.
          #  - NonPrefixedVariableFound: view-template locals, not real globals.
          #  - SuppressFilters: suppress_filters => true is a deliberate WPML bypass.
          # (Custom-table queries use the %i placeholder now, so the prepared-SQL
          # sniffs are no longer suppressed.)
          ignore-codes: |
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedNamespaceFound
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound
            WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound
            WordPressVIPMinimum.Performance.WPQueryParams.SuppressFilters_suppress_filters
